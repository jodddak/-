# STCO 성과 메일 — 자동 발송
#
# 저장 위치: 리포지토리의  .github/workflows/daily_report.yml
#           (폴더 이름의 점(.)까지 그대로여야 합니다)
#
#   화~금  한국 아침 10:07  →  어제 하루 성과
#   월요일 한국 오후 13:07  →  지난주 월~일 성과
#
# GitHub Actions는 UTC로 돕니다. 한국시간 = UTC + 9시간이라서
#   한국 10:07 = UTC 01:07  /  한국 13:07 = UTC 04:07 으로 적었습니다.
# 둘 다 UTC 기준으로도 같은 날 안에 들어와서 요일이 안 밀립니다.
# 요일 숫자: 1=월 ... 5=금
#
# 어느 리포트를 보낼지는 스크립트가 '한국 기준 오늘이 월요일인가'로 알아서 고릅니다
# (--mode auto). 손으로 돌릴 때는 아래 Run workflow 에서 직접 고를 수 있습니다.
#
# ⚠️ '정시(:00)'를 쓰면 안 됩니다.
#    GitHub 예약 실행은 전 세계 요청이 정각에 몰려서, 그 시간대 작업은 크게 밀리거나
#    아예 건너뛰어집니다(무료 러너 공통, 문서에도 '보장하지 않는다'고 명시). 실제로
#    "0 1"(한국 10:00)로 걸었을 때 하루치가 통째로 안 돌았습니다.
#    그래서 아무도 안 쓰는 분(:07)으로 옮겼습니다. 시간을 바꾸실 땐 :00, :15, :30, :45는
#    피하고 :07 / :23 / :41 같은 어정쩡한 분을 쓰세요.
#
# ⚠️ 그래도 밀리거나 아예 안 도는 날이 있습니다. 이건 GitHub 사정이라 못 고칩니다.
#    그래서 **하루에 세 번** 시도합니다(10:07 / 11:07 / 12:07).
#    이미 보낸 리포트는 Supabase의 mail_log 표를 보고 건너뛰므로 메일은 한 통만 옵니다.
#    → mail_log 표를 먼저 만들어야 합니다. 같이 드린 mail_log.sql 참고.
#      (표가 없어도 메일은 가지만, 그날 세 통이 옵니다.)

name: 성과 메일 (일별·주간)

on:
  schedule:
    # 화~금 전일 성과 — 한국 10:07 에 보내고, 못 보냈으면 11:07 / 12:07 에 다시 시도
    - cron: "7 1 * * 2-5"
    - cron: "7 2 * * 2-5"
    - cron: "7 3 * * 2-5"
    # 월요일 주간 성과 — 한국 13:07, 못 보냈으면 14:07 / 15:07
    - cron: "7 4 * * 1"
    - cron: "7 5 * * 1"
    - cron: "7 6 * * 1"
  # 손으로도 돌려볼 수 있게 (Actions 탭 → 이 워크플로 → Run workflow)
  workflow_dispatch:
    inputs:
      mode:
        description: "리포트 종류"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - daily
          - weekly
      date:
        description: "일별=집계 날짜 / 주간=그 날이 속한 주 (YYYY-MM-DD). 비우면 자동"
        required: false
      dry_run:
        description: "메일 안 보내고 확인만 하려면 true"
        required: false
        default: "false"
      dedupe:
        description: "이미 보낸 리포트면 건너뛰기 (Supabase 정시 트리거가 true로 호출)"
        required: false
        default: "false"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        run: pip install --quiet pandas supabase

      - name: 메일 보내기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
          IN_DEDUPE: ${{ github.event.inputs.dedupe }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ARGS="--mode ${IN_MODE:-auto}"
          if [ -n "$IN_DATE" ]; then
            ARGS="$ARGS --date $IN_DATE"
          fi
          if [ "$IN_DRY" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # 중복 검사를 켜는 두 경우:
          #   ① GitHub 예약 실행 — 하루 세 번 시도하므로 없으면 메일이 세 통 온다
          #   ② Supabase 정시 트리거 — dedupe=true 로 호출한다. GitHub 예약 실행이
          #      나중에 늦게 돌아도 이미 보낸 건 건너뛰게 하려는 것(이중 안전장치).
          # 손으로 Run workflow 를 누른 경우엔 '지금 보내달라'는 뜻이라 그대로 보낸다.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$IN_DEDUPE" = "true" ]; then
            ARGS="$ARGS --dedupe"
          fi
          echo "실행: python daily_report.py $ARGS"
          python daily_report.py $ARGS

      # 손으로 돌려보며 확인할 때, 만들어진 메일을 파일로 받아볼 수 있게 한다
      - name: 미리보기 파일 올리기
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: report-preview
          path: daily_report_preview.html
          if-no-files-found: ignore
