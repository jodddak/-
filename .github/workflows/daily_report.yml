# STCO 일별 성과 메일 — 평일 아침 09:30(한국) 자동 발송
#
# 저장 위치: 리포지토리의  .github/workflows/daily_report.yml
#           (폴더 이름의 점(.)까지 그대로여야 합니다)
#
# GitHub Actions는 UTC로 돕니다. 한국 09:30 = UTC 00:30 이라서 '30 0'으로 적었습니다.
# 요일 1-5는 월~금입니다.
#
# ⚠️ 크론은 GitHub가 바쁠 때 5~20분 늦게 시작할 수 있습니다(무료 계정 공통).
#    정시 발송이 꼭 필요하면 09:20으로 당겨두세요.

name: 일별 성과 메일

on:
  schedule:
    - cron: "30 0 * * 1-5"
  # 손으로도 돌려볼 수 있게 (Actions 탭 → 이 워크플로 → Run workflow)
  workflow_dispatch:
    inputs:
      date:
        description: "집계할 날짜 (YYYY-MM-DD). 비우면 어제"
        required: false
      dry_run:
        description: "메일 안 보내고 확인만 하려면 true"
        required: false
        default: "false"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        run: pip install --quiet pandas supabase

      - name: 메일 보내기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python daily_report.py $ARGS

      # 손으로 돌려보며 확인할 때, 만들어진 메일을 파일로 받아볼 수 있게 한다
      - name: 미리보기 파일 올리기
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-preview
          path: daily_report_preview.html
          if-no-files-found: ignore
