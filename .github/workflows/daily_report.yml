# STCO 성과 메일 — 자동 발송
#
# 저장 위치: 리포지토리의  .github/workflows/daily_report.yml
#           (폴더 이름의 점(.)까지 그대로여야 합니다)
#
#   화~금  한국 아침 10:00  →  어제 하루 성과
#   월요일 한국 오후 13:00  →  지난주 월~일 성과
#
# GitHub Actions는 UTC로 돕니다. 한국시간 = UTC + 9시간이라서
#   한국 10:00 = UTC 01:00  /  한국 13:00 = UTC 04:00 으로 적었습니다.
# 둘 다 UTC 기준으로도 같은 날 안에 들어와서 요일이 안 밀립니다.
# 요일 숫자: 1=월 ... 5=금
#
# 어느 리포트를 보낼지는 스크립트가 '한국 기준 오늘이 월요일인가'로 알아서 고릅니다
# (--mode auto). 손으로 돌릴 때는 아래 Run workflow 에서 직접 고를 수 있습니다.
#
# ⚠️ 크론은 GitHub가 바쁠 때 5~20분 늦게 시작할 수 있습니다(무료 계정 공통).
#    정시가 중요하면 시간을 10분쯤 당겨두세요.

name: 성과 메일 (일별·주간)

on:
  schedule:
    - cron: "0 1 * * 2-5"   # 화~금 한국 10:00 — 전일 성과
    - cron: "0 4 * * 1"     # 월요일 한국 13:00 — 전주(월~일) 성과
  # 손으로도 돌려볼 수 있게 (Actions 탭 → 이 워크플로 → Run workflow)
  workflow_dispatch:
    inputs:
      mode:
        description: "리포트 종류"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - daily
          - weekly
      date:
        description: "일별=집계 날짜 / 주간=그 날이 속한 주 (YYYY-MM-DD). 비우면 자동"
        required: false
      dry_run:
        description: "메일 안 보내고 확인만 하려면 true"
        required: false
        default: "false"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        run: pip install --quiet pandas supabase

      - name: 메일 보내기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--mode ${IN_MODE:-auto}"
          if [ -n "$IN_DATE" ]; then
            ARGS="$ARGS --date $IN_DATE"
          fi
          if [ "$IN_DRY" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행: python daily_report.py $ARGS"
          python daily_report.py $ARGS

      # 손으로 돌려보며 확인할 때, 만들어진 메일을 파일로 받아볼 수 있게 한다
      - name: 미리보기 파일 올리기
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: report-preview
          path: daily_report_preview.html
          if-no-files-found: ignore
